[workspace]
members = ["crates/engine", "crates/worker", "crates/mobile-files", "src-tauri"]
default-members = ["crates/engine", "crates/worker"]
resolver = "2"
exclude = ["vendor/rustypipe"]

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
zim-engine = { path = "crates/engine" }
