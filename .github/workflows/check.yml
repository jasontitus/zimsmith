name: Check
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: node --test scripts/sync-ios-sharing.test.mjs
      - run: npm run build
      - if: runner.os == 'Windows'
        name: Check portable MD5 backend with the requested asm feature
        run: cargo test --manifest-path vendor/md-5/Cargo.toml --features asm --locked
      - run: cargo test -p zim-engine -p zim-worker --locked
      - run: cargo check -p zim-studio --locked
      - run: cargo test -p zim-studio sharing --lib --locked
      - if: runner.os == 'Linux'
        name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        name: Verify browser, extension, imports, and captions
        run: npm run test:browser
  ios-engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: LZMA_API_STATIC=1 cargo check -p zim-engine --target aarch64-apple-ios --locked
      - name: Check share extension and durable inbox
        run: |
          swiftc -application-extension -typecheck -target arm64-apple-ios15.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" crates/mobile-files/ios/Sources/SharedURLInbox.swift src-tauri/share-extension/ShareViewController.swift
          swiftc crates/mobile-files/ios/Sources/SharedURLInbox.swift tests/swift-sharing/main.swift -o /tmp/shared-inbox-test
          /tmp/shared-inbox-test
